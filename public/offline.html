<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f4d" />
    <title>Football OS — Offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #0b1f4d;
      }
      main {
        width: min(100%, 420px);
        background: white;
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 18px 60px rgba(11, 31, 77, 0.12);
        text-align: center;
      }
      .badge {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: #0b1f4d;
        color: white;
        font-size: 34px;
      }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0; line-height: 1.55; color: #52607a; }
      button {
        margin-top: 24px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 14px 18px;
        background: #0b1f4d;
        color: white;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">⚽</div>
      <h1>You are offline</h1>
      <p>Football OS cannot reach the internet right now. Previously opened pages and saved matchday data remain available where supported.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
