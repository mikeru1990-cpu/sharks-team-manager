<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#07101f" />
    <title>Football OS</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07101f; color: #fff; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
      main { width: min(100%, 420px); padding: 28px; border-radius: 28px; background: #0d1829; border: 1px solid #1f3048; box-shadow: 0 24px 70px rgba(0,0,0,.36); }
      small { color: #93c5fd; font-weight: 900; letter-spacing: .12em; }
      h1 { margin: 8px 0 10px; font-size: 32px; }
      p { color: #a7b4c7; line-height: 1.55; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <small>FOOTBALL OS</small>
      <h1>Native shell ready</h1>
      <p>This development shell has no production server configured. A release build must set CAPACITOR_SERVER_URL to the secure Football OS production URL before iOS sync and signing.</p>
    </main>
  </body>
</html>
